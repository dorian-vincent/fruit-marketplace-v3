    async function connectWallet() {
      if (window.ethereum) {
        try {
          provider = new ethers.BrowserProvider(window.ethereum);
          signer = await provider.getSigner();
          const address = await signer.getAddress();
          document.getElementById("account").innerText = "Compte : " + address;

          contract = new ethers.Contract(contractAddress, abi, signer);

          console.log("Contrat initialisé avec l'adresse :", contractAddress);
        } catch (error) {
          console.error("Erreur de connexion à MetaMask :", error);
        }
      } else {
        alert("MetaMask n'est pas installé !");
      }
    } 


    async function listFruit() {
      if (!contract) {
        alert("Veuillez d'abord vous connecter à MetaMask.");
        return;
      }

      const name = document.getElementById("fruitName").value;
      const price = document.getElementById("fruitPrice").value;

      if (!name || !price || isNaN(price)) {
        alert("Veuillez remplir correctement les champs.");
        return;
      }

      try {
        const tx = await contract.listFruit(name, price);
        await tx.wait(); // attendre que la transaction soit confirmée
        alert("Fruit listé avec succès !");
      } catch (error) {
        console.error("Erreur lors de la mise en vente :", error);
        alert("Erreur lors de la mise en vente.");
      }
    }
